name: PatchTheCVE deploy (public repo; builds from the private source repo) (fast every 20 min, full every 2 hours)

on:
  schedule:
    - cron: "30 */2 * * *"   # full run every 2 hours at 00:00, 02:00 ... IST (18:30, 20:30 ... UTC): new CVEs plus distro fixes
    - cron: "30 1-23/2 * * *"  # history backfill lane on the odd hours, one hour after each full run: core stage only, several windows, no emails
    - cron: "*/20 * * * *"   # fast run: new CVEs, exploited list and feeds only (core stage)
  workflow_dispatch:          # manual "Run workflow" button, and the AWS timer (mode fast = core only, mode full-timer = full run unless one finished in the last 50 minutes)
    inputs:
      mode:
        description: "manual (default), fast, backfill or full-timer (used by the AWS timer)"
        type: string
        default: manual
      post_now:
        description: "Also post today's top CVE to LinkedIn and Slack right now (tick this for a test)"
        type: boolean
        default: false

permissions:
  contents: write
  pages: write
  id-token: write
  actions: read

concurrency:
  group: patchwatch
  cancel-in-progress: false

jobs:
  # fast (every 20 min) runs do only the core stage; the 2-hourly, push and manual runs do all four
  plan:
    runs-on: ubuntu-latest
    outputs:
      stages: ${{ steps.p.outputs.stages }}
      skip: ${{ steps.p.outputs.skip }}
    steps:
      - id: p
        env:
          GH_TOKEN: ${{ github.token }}
          MODE: ${{ inputs.mode }}
          SCHED: ${{ github.event.schedule }}
        run: |
          echo "skip=false" >> "$GITHUB_OUTPUT"
          if [ "$SCHED" = "*/20 * * * *" ] || [ "$MODE" = "fast" ] || [ "$SCHED" = "30 1-23/2 * * *" ] || [ "$MODE" = "backfill" ]; then
            echo 'stages=["core"]' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo 'stages=["core","enrich1"]' >> "$GITHUB_OUTPUT"
          WINDOW=0
          [ "$MODE" = "full-timer" ] && WINDOW=50
          if [ "$WINDOW" -gt 0 ]; then
            # backup and timer runs: only when no full run (one with an enrich1 job) finished recently
            CUT=$(date -u -d "$WINDOW minutes ago" +%FT%TZ)
            for R in $(gh api "repos/${{ github.repository }}/actions/workflows/update.yml/runs?status=success&per_page=10" --jq ".workflow_runs[]|select(.updated_at>\"$CUT\")|.id"); do
              if gh api "repos/${{ github.repository }}/actions/runs/$R/jobs" --jq '.jobs[].name' | grep -q 'enrich1'; then
                echo "A full run ($R) finished in the last $WINDOW minutes, skipping this one"
                echo "skip=true" >> "$GITHUB_OUTPUT"
                break
              fi
            done
          fi

  # Four stages run one after another and each one publishes the site:
  #   core    = CVE data from NVD, CVE Program, KEV, EPSS  -> live within minutes
  #   enrich* = distro and ecosystem fixes for the next 20 CVEs (highest priority first) -> live again after each chunk
  update:
    needs: plan
    if: needs.plan.outputs.skip != 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src
    timeout-minutes: 120                # a design change (new CSS version) re-uploads every page once; normal runs send only changed files
    strategy:
      max-parallel: 1
      matrix:
        stage: ${{ fromJSON(needs.plan.outputs.stages) }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # The code lives in a PRIVATE repo; SOURCE_TOKEN is a read-only token for it. Only the built site is ever published here.
      - uses: actions/checkout@v4
        with:
          repository: PranaySSawant/patchwatch
          token: ${{ secrets.SOURCE_TOKEN }}
          path: src

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: src/requirements.txt
      - run: pip install -r requirements.txt

      # Data lives on a separate "data" branch that is rewritten as ONE commit each stage,
      # so the repository never grows with history.
      - name: Restore data from the data branch
        env:
          PUB: https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git
        run: |
          for REMOTE in "$PUB" origin; do
            if git ls-remote --exit-code --heads "$REMOTE" data >/dev/null 2>&1; then
              git fetch --depth=1 "$REMOTE" data
              for f in data.json sources.json blog.json posted.json advisories.json; do git checkout FETCH_HEAD -- $f 2>/dev/null || true; done
              break
            fi
          done

      - name: AWS credentials (OIDC, no stored keys)
        id: aws
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::080369785465:role/patchthecve-deploy
          aws-region: ap-south-1
      - name: Use the newest data (S3 state bucket, falls back to the data branch)
        continue-on-error: true
        if: steps.aws.outcome == 'success'
        env:
          STATE_BUCKET: patchthecve-state-080369785465
        run: python state.py pull

      # The big Debian / Alpine / Microsoft files are downloaded once and reused by the next stages and runs.
      - uses: actions/cache@v4
        with:
          path: src/.cache
          key: idx-${{ github.run_id }}-${{ matrix.stage }}
          restore-keys: |
            idx-${{ github.run_id }}-
            idx-

      - name: Collect (${{ matrix.stage }})
        id: collect
        run: python update_data.py
        env:
          PYTHONUNBUFFERED: "1"                      # print log lines live instead of at the end
          PW_CACHE_DIR: .cache
          STAGE: ${{ matrix.stage == 'core' && 'core' || 'enrich' }}
          VENDOR_BUDGET: "120"                       # CVEs per enrich chunk (one enrich stage, so one build and upload instead of three)
          BACKFILL_WINDOWS: ${{ (github.event.schedule == '*/20 * * * *' || inputs.mode == 'fast') && '0' || ((github.event.schedule == '30 1-23/2 * * *' || inputs.mode == 'backfill') && '3' || '1') }}   # history: 1 window on full runs, 3 on the backfill lane (about 6,000 CVEs per window; older years use longer windows)
          BACKFILL_MAX_NEW: "15000"                 # stop adding old CVEs once a run has added this many (keeps every run short)
          BACKFILL_SECONDS: ${{ (github.event.schedule == '30 1-23/2 * * *' || inputs.mode == 'backfill') && '480' || '240' }}
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}    # optional, free key from nvd.nist.gov
          GITHUB_TOKEN: ${{ github.token }}          # lets the GitHub Advisory lookups use the higher rate limit

      - name: GitHub advisories with no CVE id (optional)
        if: matrix.stage == 'core'
        continue-on-error: true
        run: python ghsa.py
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Restore the page and software caches (incremental build)
        if: (matrix.stage == 'core' || steps.collect.outputs.changed == '1') && steps.aws.outcome == 'success'
        continue-on-error: true
        env:
          STATE_BUCKET: patchthecve-state-080369785465
        run: python state.py pull_hash

      - name: Build static site (only changed CVE pages are rendered)
        if: matrix.stage == 'core' || steps.collect.outputs.changed == '1'
        env:
          INCREMENTAL: ${{ steps.aws.outcome == 'success' && '1' || '0' }}
        run: python build_site.py

      - name: SEO check (titles, descriptions, links, sitemap; warn only)
        if: matrix.stage == 'core'
        continue-on-error: true
        run: python seo_check.py dist

      - name: Readability check (text contrast on key pages and search results; warn only, manual runs)
        if: matrix.stage == 'core' && inputs.mode == 'manual'
        continue-on-error: true
        timeout-minutes: 6
        run: |
          pip install playwright >/dev/null 2>&1 && python -m playwright install --with-deps chromium >/dev/null 2>&1
          python contrast_check.py dist

      - name: Daily post drafts (LinkedIn, X, Reddit) to the run summary and Slack
        if: matrix.stage == 'core' && github.event.schedule != '*/20 * * * *' && inputs.mode != 'fast' && github.event.schedule != '30 1-23/2 * * *' && inputs.mode != 'backfill'
        continue-on-error: true
        run: python social.py
        env:
          FORCE: ${{ inputs.post_now && '1' || '' }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}

      - name: Weekly Search Console report (optional, needs GSC_SA_JSON and GSC_SITE)
        if: matrix.stage == 'core' && github.event.schedule != '*/20 * * * *' && inputs.mode != 'fast' && github.event.schedule != '30 1-23/2 * * *' && inputs.mode != 'backfill'
        continue-on-error: true
        run: |
          if [ "$(date -u +%u)" = "1" ] && [ "$(date -u +%H)" = "04" ] || [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            pip install -q google-auth requests
            python gsc_report.py
          fi
        env:
          GSC_SA_JSON: ${{ secrets.GSC_SA_JSON }}
          GSC_SITE: ${{ secrets.GSC_SITE }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}

      - name: Save data.json to the S3 state bucket (no size limit)
        continue-on-error: true
        if: (matrix.stage == 'core' || steps.collect.outputs.changed == '1') && steps.aws.outcome == 'success'
        env:
          STATE_BUCKET: patchthecve-state-080369785465
        run: python state.py push

      - name: Save data to the data branch (single squashed commit)
        if: matrix.stage == 'core' || steps.collect.outputs.changed == '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          rm -rf /tmp/databranch && mkdir /tmp/databranch
          # git refuses files over 100 MB; the full data lives in the S3 state bucket, the branch copy is only a fallback
          [ "$(stat -c%s data.json)" -lt 80000000 ] && cp data.json /tmp/databranch/ || echo "data.json too big for the data branch, S3 state bucket holds it"
          cp sources.json /tmp/databranch/ 2>/dev/null || true
          cp blog.json /tmp/databranch/ 2>/dev/null || true
          cp posted.json /tmp/databranch/ 2>/dev/null || true
          cp advisories.json /tmp/databranch/ 2>/dev/null || true
          cd /tmp/databranch
          git init -q -b data
          git config user.name "patchwatch-bot"
          git config user.email "bot@users.noreply.github.com"
          git add -A
          git commit -q -m "CVE data $(date -u +%FT%TZ) (${{ matrix.stage }})"
          git push -q --force "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" data


      - name: Slack alert for new important CVEs (optional)
        if: matrix.stage == 'core'
        run: python notify.py
        continue-on-error: true
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}

      - name: Telegram channel post for new important CVEs (optional)
        if: matrix.stage == 'core'
        run: python telegram.py
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

      - name: Weekly newsletter draft (Mondays, optional Buttondown)
        if: matrix.stage == 'core' && github.event.schedule != '*/20 * * * *' && inputs.mode != 'fast' && github.event.schedule != '30 1-23/2 * * *' && inputs.mode != 'backfill'
        run: python newsletter.py
        continue-on-error: true
        env:
          BUTTONDOWN_API_KEY: ${{ secrets.BUTTONDOWN_API_KEY }}

      - name: Show the OIDC subject (only if the role could not be assumed)
        if: always() && steps.aws.outcome == 'failure'
        continue-on-error: true
        run: |
          T=$(curl -s -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com" | python3 -c "import sys,json;print(json.load(sys.stdin)['value'])")
          python3 - "$T" <<'PY'
          import sys, json, base64
          p = sys.argv[1].split(".")[1]; p += "=" * (-len(p) % 4)
          c = json.loads(base64.urlsafe_b64decode(p))
          print("OIDC sub:", c.get("sub")); print("OIDC aud:", c.get("aud")); print("OIDC iss:", c.get("iss"))
          print("::warning title=OIDC claims::sub=%s aud=%s iss=%s" % (c.get("sub"), c.get("aud"), c.get("iss")))
          PY
      - name: Publish to S3 (served by CloudFront; changed files only)
        id: s3
        if: matrix.stage == 'core' || steps.collect.outputs.changed == '1'
        env:
          S3_BUCKET: patchthecve-site-080369785465
          STATE_BUCKET: patchthecve-state-080369785465
          CLOUDFRONT_DISTRIBUTION_ID: E15T8DM1R8I96A   # changed CSS/JS/images are invalidated so visitors never see an old copy
        run: |
          aws configure set default.s3.max_concurrent_requests 100
          aws configure set default.s3.max_queue_size 20000
          python s3_deploy.py dist
      - name: Save the page and software caches (only after a good upload)
        if: (matrix.stage == 'core' || steps.collect.outputs.changed == '1') && steps.s3.outcome == 'success'
        continue-on-error: true
        env:
          STATE_BUCKET: patchthecve-state-080369785465
        run: python state.py push_hash

      - name: Ping IndexNow (Bing, Yandex) about new pages
        if: matrix.stage == 'core'
        continue-on-error: true
        run: python indexnow.py

      - name: Email a ready-to-copy company page post (6 a day) and the Monday weekly wrap-up (after the deploy, so every link in the post is live)
        if: matrix.stage == 'core' && github.event.schedule != '*/20 * * * *' && inputs.mode != 'fast' && github.event.schedule != '30 1-23/2 * * *' && inputs.mode != 'backfill'
        continue-on-error: true
        run: |
          sleep 45   # let the new pages reach the CDN so the links in the post open
          python notify_email.py pagepost
          python notify_email.py weekly
        env:
          FORCE: ${{ inputs.post_now && '1' || '' }}
          MAIL_USER: ${{ secrets.MAIL_USER }}
          MAIL_APP_PASSWORD: ${{ secrets.MAIL_APP_PASSWORD }}
          MAIL_TO: pranaysawantss2003@gmail.com

      - name: Save which posts were already emailed (posted.json) to the data branch
        if: matrix.stage == 'core' && github.event.schedule != '*/20 * * * *' && inputs.mode != 'fast' && github.event.schedule != '30 1-23/2 * * *' && inputs.mode != 'backfill'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          rm -rf /tmp/databranch && mkdir /tmp/databranch
          # git refuses files over 100 MB; the full data lives in the S3 state bucket, the branch copy is only a fallback
          [ "$(stat -c%s data.json)" -lt 80000000 ] && cp data.json /tmp/databranch/ || echo "data.json too big for the data branch, S3 state bucket holds it"
          cp sources.json /tmp/databranch/ 2>/dev/null || true
          cp blog.json /tmp/databranch/ 2>/dev/null || true
          cp posted.json /tmp/databranch/ 2>/dev/null || true
          cp advisories.json /tmp/databranch/ 2>/dev/null || true
          cd /tmp/databranch
          git init -q -b data
          git config user.name "patchwatch-bot"
          git config user.email "bot@users.noreply.github.com"
          git add -A
          git commit -q -m "CVE data $(date -u +%FT%TZ) (posts)"
          git push -q --force "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" data

      - name: Email summary after each full 2-hour run (optional, needs MAIL_USER and MAIL_APP_PASSWORD)
        if: matrix.stage == 'core' && github.event.schedule != '*/20 * * * *' && inputs.mode != 'fast' && github.event.schedule != '30 1-23/2 * * *' && inputs.mode != 'backfill'
        continue-on-error: true
        run: python notify_email.py run
        env:
          MAIL_USER: ${{ secrets.MAIL_USER }}
          MAIL_APP_PASSWORD: ${{ secrets.MAIL_APP_PASSWORD }}
          MAIL_TO: pranaysawantss2003@gmail.com
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

      - name: Email if this run failed (optional)
        if: failure()
        continue-on-error: true
        run: python notify_email.py failure
        env:
          MAIL_USER: ${{ secrets.MAIL_USER }}
          MAIL_APP_PASSWORD: ${{ secrets.MAIL_APP_PASSWORD }}
          MAIL_TO: pranaysawantss2003@gmail.com
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

      - name: Slack alert if this run failed (optional)
        if: failure()
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ -n "$SLACK_WEBHOOK_URL" ]; then
            curl -sS -X POST -H 'Content-type: application/json' --data "{\"text\":\"PatchTheCVE update failed: $RUN_URL\"}" "$SLACK_WEBHOOK_URL"
          else
            echo "No SLACK_WEBHOOK_URL set. GitHub also emails you about failed runs."
          fi
