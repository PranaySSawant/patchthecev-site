name: PatchTheCVE LinkedIn post emails (light, extra schedule so posts arrive even when the big run is late)

on:
  schedule:
    - cron: "35 4,6,10,14,16 * * *"   # 10:05 AM, 12:05 PM, 4:05 PM, 8:05 PM, 10:05 PM IST: the 5 daily posts (10:00, 12:00, 16:00, 20:00, 22:00)
    - cron: "5 5,7,11,15,17 * * *"   # backup half an hour later
    - cron: "40 5,7,11,15,17 * * *"  # second backup
  workflow_dispatch:
    inputs:
      post_now:
        description: "Send and publish the next post right now (a test), ignoring the time slots"
        type: boolean
        default: false

permissions:
  contents: write
  id-token: write

concurrency:
  group: patchwatch
  cancel-in-progress: false

jobs:
  posts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          repository: PranaySSawant/patchwatch
          token: ${{ secrets.SOURCE_TOKEN }}
          path: src
      - name: Restore data from the data branch
        working-directory: src
        env:
          PUB: https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git
        run: |
          git fetch --depth=1 "$PUB" data
          for f in data.json sources.json blog.json posted.json advisories.json; do git checkout FETCH_HEAD -- $f 2>/dev/null || true; done
      - name: AWS credentials (OIDC)
        id: aws
        continue-on-error: true
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::080369785465:role/patchthecve-deploy
          aws-region: ap-south-1
      - name: Use the newest data (S3 state bucket)
        if: steps.aws.outcome == 'success'
        continue-on-error: true
        working-directory: src
        env:
          STATE_BUCKET: patchthecve-state-080369785465
        run: python state.py pull
      - name: Email the post(s) that are due (and the Monday wrap-up)
        working-directory: src
        env:
          MAIL_USER: ${{ secrets.MAIL_USER }}
          MAIL_APP_PASSWORD: ${{ secrets.MAIL_APP_PASSWORD }}
          MAIL_TO: pranaysawantss2003@gmail.com
          LINKEDIN_ACCESS_TOKEN: ${{ secrets.LINKEDIN_ACCESS_TOKEN }}
          LINKEDIN_PERSON_ID: ${{ secrets.LINKEDIN_PERSON_ID }}
          FORCE: ${{ inputs.post_now && '1' || '' }}
        run: |
          cp posted.json /tmp/posted.before 2>/dev/null || true
          python notify_email.py pagepost
          python notify_email.py weekly
          python linkedin_post.py   # publishes the same post to the LinkedIn profile (skips without a token or when nothing was due)
      - name: Save posted.json back to the data branch if it changed
        working-directory: src
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -f posted.json ] && ! cmp -s posted.json /tmp/posted.before; then
            rm -rf /tmp/databranch && mkdir /tmp/databranch
            for f in sources.json blog.json posted.json advisories.json; do cp $f /tmp/databranch/ 2>/dev/null || true; done
            [ -f data.json ] && [ "$(stat -c%s data.json)" -lt 80000000 ] && cp data.json /tmp/databranch/ || true
            cd /tmp/databranch
            git init -q -b data
            git config user.name "patchwatch-bot"
            git config user.email "bot@users.noreply.github.com"
            git add -A
            git commit -q -m "posts $(date -u +%FT%TZ)"
            git push -q --force "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" data
          fi
